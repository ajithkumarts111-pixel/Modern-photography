/* ---------- SECTIONS ---------- */
const Filter=(id)=>`<div class="cats" id="${id}" role="tablist">${['All',...CATS].map((c,i)=>`<button role="tab" class="${i?'':'on'}" aria-selected="${!i}" data-c="${c}">${c}</button>`).join('')}</div>`;
const Cta=()=>`<section class="cta"><div class="wrap"><h2>Let's create<br>something worth<br>remembering.</h2><div class="row"><a class="btn light" href="#/contact">Book a Shoot ${arrow}</a><a class="btn ghost" href="#/portfolio">View Portfolio</a></div></div>${ph({...P[9],ar:'auto'})}</section>`;
const Footer=()=>`<footer><div class="wrap"><div class="fg"><div><a class="logo" href="#/">Aurelle<i>.</i></a><p style="color:var(--mute);max-width:300px">Wedding and professional photography, telling stories across India.</p></div>
<div><h4>Explore</h4><ul><li><a href="#/">Home</a></li><li><a href="#/portfolio">Portfolio</a></li><li><a href="#/services">Services</a></li><li><a href="#/about">About</a></li><li><a href="#/contact">Contact</a></li></ul></div>
<div><h4>Follow</h4><ul><li><a href="#">Instagram</a></li><li><a href="#">Facebook</a></li><li><a href="#">YouTube</a></li></ul></div>
<div><h4>Contact</h4><ul><li><a href="mailto:hello@aurelle.studio">hello@aurelle.studio</a></li><li><a href="tel:+910000000000">+91 00000 00000</a></li><li>Chennai, Tamil Nadu</li></ul></div></div><div class="cr">© 2026 Aurelle Studio. All rights reserved.</div></div></footer>`;
const pages={
home(){const hs=[P[0],P[1],P[9],P[2],P[7]];
return `<section class="hero" aria-roledescription="carousel" aria-label="Featured photographs">${hs.map((p,i)=>`<div class="sl${i?'':' on'}">${ph({...p,ar:'auto'},i)}</div>`).join('')}
<div class="hc"><div class="wrap"><p class="lbl">Photography &amp; Stories</p><h1>Your moments,<br>beautifully captured.</h1><p class="d">Timeless photographs created with emotion, intention and an eye for the moments that matter.</p><a class="btn" href="#/portfolio">Explore Our Work ${arrow}</a>
<div class="hctl"><button id="hp" aria-label="Previous photo">←</button><button id="hn" aria-label="Next photo">→</button><span id="hcn" aria-live="polite">01 / 0${hs.length}</span></div></div></div></section>
<section class="sec"><div class="wrap split r"><div class="rv"><p class="lbl">Our Approach</p><h2>Capturing moments<br>that feel like you.</h2><p>We create photographs that preserve the emotion, atmosphere and little details that make every story unique.</p><a class="btn ghost" href="#/about">Discover Our Story ${arrow}</a></div>
<div class="asym rv">${ph({...P[4],ar:'4/5'})}<div class="b">${ph({...P[3],ar:'1/1'})}</div></div></div></section>
<section class="sec" style="padding-top:0"><div class="wrap"><div class="hd"><h2>Our Stories</h2><p>Every celebration has its own story.</p></div>${Filter('hf')}<div class="gal" id="hg"></div></div></section>
<section class="sec story"><div class="wrap"><p class="lbl">Scroll Through</p><h2>Every frame<br>tells a story.</h2><div class="sc">${[[P[0],'Wedding','Chennai · 2026'],[P[7],'Couple','Munnar · 2025'],[P[2],'Portrait','Salem · 2026'],[P[5],'Fashion','Mumbai · 2026']].map(([p,c,l])=>`<figure class="rv">${ph(p)}<figcaption><b>${c.toUpperCase()}</b> &nbsp;${l.toUpperCase()}</figcaption></figure>`).join('')}</div></div></section>
<section class="sec"><div class="wrap feat"><div class="rv">${ph({...P[9],ar:'3/2'})}</div><div class="rv"><p class="lbl">Featured Story</p><h2>A beautiful<br>day to remember</h2><p class="meta">Wedding Photography<br>Chennai · 2026</p><a class="btn" href="#/story/a-beautiful-day">View Full Story ${arrow}</a></div></div></section>
<section class="sec" style="background:var(--white)"><div class="wrap"><h2 style="margin-bottom:48px">What we capture</h2>${svList()}</div></section>
<section class="sec"><div class="wrap split"><div class="rv" style="position:relative;padding-bottom:12%">${ph({...P[10],ar:'4/5'})}<div style="position:absolute;width:40%;right:-3%;bottom:0;border:8px solid var(--ivory)">${ph({...P[8],ar:'1/1'})}</div></div><div class="rv"><p class="lbl">About</p><h2>Behind<br>the lens</h2><p>We believe photography is more than creating beautiful images. It is about preserving the feeling of a moment — the laughter, the silence, the people and everything in between.</p><a class="btn ghost" href="#/about">Meet The Photographer ${arrow}</a></div></div></section>
<section class="sec" style="background:var(--white)"><div class="wrap"><h2 style="margin-bottom:56px">Words from our clients</h2><div class="tm">${TM.map(t=>`<div class="rv"><blockquote>“${t[0]}”</blockquote><cite>${t[1]}</cite><small>${t[2]}</small></div>`).join('')}</div></div></section>${Cta()}`},
portfolio(){return `<div class="wrap"><div class="ph-hd"><p class="lbl">Portfolio</p><h1>The work</h1><p>Weddings, portraits and everything between — selected stories from recent years.</p></div>${Filter('pf')}<div class="gal" id="pg"></div><div style="margin-top:60px">${S.map(s=>`<a class="nx" href="#/story/${s.id}"><span>${s.title}</span><span style="color:var(--red)">${s.cat} · ${s.loc} →</span></a>`).join('')}</div></div>${Cta()}`},
story(id){const i=S.findIndex(s=>s.id===id),s=S[i<0?0:i],k=i<0?0:i,im=s.imgs.map(n=>P[n]),cl=['w','n','h','h','n','w'];
return `<section class="wrap"><div class="ph-hd"><p class="lbl">${s.cat}</p><h1>${s.title}</h1><p>${s.loc} · ${s.date}</p></div></section><div class="wrap">${ph({...im[0],ar:'16/9'})}<div class="split r sec"><h2>The story</h2><p style="margin:0;max-width:520px">${s.txt}</p></div>
<div class="sg">${im.map((p,j)=>`<div class="${cl[j]} rv">${Tile({...p,ar:j%3==0?'3/2':j%3==1?'3/4':'1/1'},j)}</div>`).join('')}</div>
<div class="nx" style="margin-top:80px"><a href="#/story/${S[(k+2)%3].id}">← Previous Story</a><a href="#/story/${S[(k+1)%3].id}">Next Story →</a></div></div>
<section class="sec" style="text-align:center"><p class="lbl">Planning something special?</p><a class="btn" href="#/contact">Book a Shoot ${arrow}</a></section>`},
services(){return `<div class="wrap"><div class="ph-hd"><p class="lbl">Services</p><h1>What we capture</h1><p>Pricing is tailored to each story — tell us about yours and we'll send a personal quote.</p></div>${SV.map(s=>`<div class="sp rv">${ph({...P[s[3]],ar:'4/5'})}<div><h2>${s[0]}</h2><p style="color:var(--mute);margin-top:1rem">${s[1]}</p><p class="lbl" style="margin:1.6rem 0 0">What's included</p><ul>${s[2].map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn" href="#/contact">Enquire Now ${arrow}</a></div></div>`).join('')}</div>`},
about(){return `<div class="wrap"><div class="ph-hd"><p class="lbl">About</p><h1>Behind<br>the lens</h1></div><div class="split sec" style="padding-top:20px"><div style="position:relative;padding-bottom:12%">${ph({...P[10],ar:'4/5'})}<div style="position:absolute;width:40%;right:-3%;bottom:0;border:8px solid var(--ivory)">${ph({...P[8],ar:'1/1'})}</div></div><div><p style="color:var(--ink);font-size:1.2rem;max-width:520px;margin-top:0">We believe photography is more than creating beautiful images. It is about preserving the feeling of a moment — the laughter, the silence, the people and everything in between.</p><p>Based in Chennai and travelling across India, we shoot weddings, portraits and events with a quiet, documentary eye. Our goal is simple: photographs you will want to hold for decades.</p><a class="btn" href="#/contact">Book a Shoot ${arrow}</a></div></div></div>`},
contact(){return `<div class="wrap"><div class="split r sec" style="align-items:start"><div><p class="lbl">Contact</p><h1 style="font-size:clamp(2.4rem,6vw,4.5rem)">Let's talk about<br>your story.</h1><p>Share a few details and we'll reply within one working day.</p><div class="ct"><a href="https://instagram.com">Instagram</a><a href="https://wa.me/910000000000">WhatsApp</a><a href="mailto:hello@aurelle.studio">Email</a></div></div>
<form id="bf" novalidate><div class="fr"><label>Name<input name="n" required autocomplete="name"></label><label>Email<input type="email" name="e" required autocomplete="email"></label></div><div class="fr"><label>Phone<input type="tel" name="p" autocomplete="tel"></label><label>Photography type<select name="t">${['Wedding','Birthday','Couple','Portrait','Event','Fashion','Commercial','Other'].map(o=>`<option>${o}</option>`).join('')}</select></label></div><div class="fr"><label>Preferred date<input type="date" name="d"></label><label>Location<input name="l"></label></div><label>Message<textarea name="m" rows="4"></textarea></label><div><button class="btn" type="submit">Send Enquiry ${arrow}</button></div><p id="ok" role="status" style="color:var(--red);margin:0"></p></form></div></div>`}};
function svList(){return `<div class="sv"><ol class="sl2" style="list-style:none">${SV.map((s,i)=>`<li><a href="#/services" data-p="${s[3]}"><em>0${i+1}</em><h3>${s[0]}</h3><span aria-hidden="true">→</span><p>${s[1]}</p></a></li>`).join('')}</ol><div class="pv" aria-hidden="true">${SV.map((s,i)=>`<div style="position:absolute;inset:0;opacity:${i?0:1};transition:opacity .7s" data-v="${i}">${ph({...P[s[3]],ar:'auto'})}</div>`).join('')}</div></div>`}
/* ---------- ROUTER ---------- */
let timer;
function fillGal(el,fid){const f=$('#'+fid);const draw=c=>{const l=c==='All'?P:P.filter(p=>p.cat.replace(/s$/,'')===c.replace(/s$/,''));el.classList.add('f');setTimeout(()=>{el.innerHTML=l.map((p,i)=>Tile(p,i)).join('');$$('.it',el).forEach(b=>b.onclick=()=>lopen(l,+b.dataset.i));el.classList.remove('f')},300)};
f.onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('button',f).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});draw(b.dataset.c)};
el.innerHTML='';draw('All')}
function render(){clearInterval(timer);const h=location.hash.slice(2)||'',[r,a]=h.split('/');const app=$('#app');
app.innerHTML=`<div class="pg">${(pages[r||'home']||pages.home)(a)}${r==='story'?'':''}</div>${Footer()}`;
$$('.links a').forEach((l,i)=>l.classList.toggle('on',l.getAttribute('href')==='#/'+(r||'')));scrollTo(0,0);
if(!r||r==='home'){fillGal($('#hg'),'hf');const s=$$('.sl'),n=s.length;let c=0;const go=d=>{s[c].classList.remove('on');c=(c+d+n)%n;s[c].classList.add('on');$('#hcn').textContent=`0${c+1} / 0${n}`};timer=setInterval(()=>go(1),6500);$('#hn').onclick=()=>{go(1);clearInterval(timer)};$('#hp').onclick=()=>{go(-1);clearInterval(timer)};
$$('.sl2 a').forEach(a=>a.onmouseenter=()=>$$('[data-v]').forEach(v=>v.style.opacity=v.dataset.v==[...a.closest('ol').children].indexOf(a.parentNode)?1:0))}
if(r==='portfolio')fillGal($('#pg'),'pf');
if(r==='story'){const s=S.find(x=>x.id===a)||S[0];$$('.sg .it').forEach(b=>b.onclick=()=>lopen(s.imgs.map(n=>P[n]),+b.dataset.i))}
const bf=$('#bf');if(bf)bf.onsubmit=e=>{e.preventDefault();$('#ok').textContent=bf.n.value&&bf.e.value?`Thank you, ${bf.n.value}. We'll be in touch shortly.`:'Please add your name and email.'};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});$$('.rv').forEach(x=>io.observe(x))}
addEventListener('hashchange',render);render();
</script></body></html>
